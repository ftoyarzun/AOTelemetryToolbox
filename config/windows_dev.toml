# Data grabber configuration for local runs on Windows, against the repo's own
# data/ folder. simulation/DataGeneration.ipynb writes to its [output] hdf5_dir;
# copy these values into data_grabber.toml to use them elsewhere. Only [output]
# is filled in: the threads and static entries are only needed to grab telemetry
# with aott/telemetry.py on the observatory machine (see data_grabber.toml).

[output]
# Relative to the repo root (AutomaticAnalysis.py is run from there). A
# subfolder per date is looked for inside hdf5_dir; if it doesn't exist,
# hdf5_dir itself is searched instead.
hdf5_dir = "data"
# A subfolder per date is created inside this one for each compiled report.
report_dir = "AO reports"
