# Data grabber configuration: the one data grabber config of the project, edit it for
# this machine. Read by aott/telemetry.py (python -m aott.telemetry <target> <duration_s>),
# and its [output] section by aott/AutomaticAnalysis.py and aott/NightlyReport.py.
# The instrument values (site, pupil, wavelengths...) are in config/instrument.toml.
# data_grabber_ekarus.toml, data_grabber_rama.toml and windows_dev.toml hold filled-in
# values for other machines to copy from.
#
# What is recorded is described by two kinds of entries, each naming where it goes in the
# HDF5 file:
#
#   [threads.<name>]          one acquisition thread. Every thread runs in parallel for the
#                             duration given on the command line. Each iteration waits for a
#                             new frame of its `pacer` stream, then reads the current value of
#                             its other streams.
#   [threads.<name>.streams.<stream>]
#                             one shared memory recorded at every iteration of its thread
#   [static.<name>]           one shared memory (or .npy file, or constant) read once, before
#                             the grab
#
# Destinations: `dataset = "Group/Name"` stores an array; `attr = "Group/Name@Attr"` stores
# the [0, 0] element of the image (anything else in the image is only kept by a dataset).
# Both accept a list. "@Attr" alone is an attr of the file root.
#
# The analysis reads fixed destinations: the entries below that are not commented out are
# the ones it needs, so keep their destinations and fill in their shared memories. telemetry.py
# refuses to start while a needed destination is missing or a value is still "TODO". Add any
# other shared memory with the destination of your choice: the analysis ignores it, and it
# is kept in the file.
#
# Stream options:
#   shm               path of the .im.shm file
#   dataset           where the kept samples go, one per row
#   timestamps        where the shm timestamps of the kept samples go (Unix time)
#   keep_every        keep one sample out of this many (default 1). The streams the analysis
#                     lines up with the loop (DM commands, measurements, loop status) keep all.
#   mean              where the mean of every sample read goes (kept or not)
#   window            part of the frame to keep, in pixels, as { y = [start, stop], x = [start, stop] }
#   sliceable         true (default) if the shm crops to `window` itself, which is faster;
#                     false reads the whole frame and crops it
#   background        a static entry subtracted from every sample, which is then stored as
#                     float32. Leave it out when the shm frames are already background subtracted.
#   saturation_level  writes Max_Value, Saturation_Level and Saturated (max above the level,
#                     before the background is subtracted) attrs on the dataset
#   description       written as a Description attr of the dataset
#
# Static entry options:
#   source            .im.shm or .npy path; or `value` for a constant with no shm
#   dataset / attr    destinations, see above
#   window_of         "thread.stream": crop the array like that stream's frames
#   description       written as a Description attr of the dataset

[acquisition]
# dao semaphore number the readers wait on (a thread can override it with its own `semaphore`)
semaphore = "TODO"
# the science camera the analysis uses: its thread writes to Science/<analysed_camera>/, and
# config/instrument.toml has a [science_camera.<analysed_camera>] section
analysed_camera = "camera"
# Optional: CPU cores python -m aott.observe runs on (grab, analysis and report), like
# taskset -c. Linux only, ignored elsewhere. Leave it out to use every core.
# cpus = [2, 3, 4, 5]

[output]
# folder for the observation HDF5 files, a subfolder per UTC date is created inside
hdf5_dir = "TODO"
# folder for the PDF reports, a subfolder per date is created inside
report_dir = "TODO"


# ---------------------------------------------------------------- loop thread

[threads.loop]
pacer = "wfs_frames"
# static entry with the expected rate [Hz], used to size the buffers
rate = "wfs_fps"

[threads.loop.streams.wfs_frames]
# calibrated wavefront sensor frames
shm = "TODO"
dataset = "WFS/WFS_Images"
timestamps = "WFS/WFS_TimeStamps"
keep_every = 1
# mean = "WFS/Mean_Frame"

[threads.loop.streams.dm_commands]
# deformable mirror commands
shm = "TODO"
dataset = "WFS/DM_commands"
timestamps = "WFS/DM_TimeStamps"

[threads.loop.streams.wfs_measurements]
# wavefront sensor measurements, in DM command space
shm = "TODO"
dataset = "WFS/WFS_measurements"

[threads.loop.streams.loop_status]
# loop command (open/closed status, nonzero = closed loop)
shm = "TODO"
dataset = "WFS/loop_status"


# ---------------------------------------------------------------- science camera thread

[threads.camera]
pacer = "frames"
rate = "camera_fps"

[threads.camera.streams.frames]
# science camera frames
shm = "TODO"
dataset = "Science/camera/Science_PSFs"
timestamps = "Science/camera/PSF_TimeStamps"
# window = { y = [0, 400], x = [0, 400] }
# sliceable = true
# background = "camera_background"
# saturation_level = 65400


# ---------------------------------------------------------------- read once

[static.wfs_fps]
# wavefront sensor frame rate [Hz], also the loop frequency
source = "TODO"
attr = ["WFS/WFS_Images@FPS", "WFS@Loop_Freq"]

[static.wfs_gain]
# wavefront sensor camera gain
source = "TODO"
attr = "WFS/WFS_Images@Gain"

[static.valid_pixel_map]
# valid pixel map of the wavefront sensor
source = "TODO"
dataset = "WFS/Valid_Pixel_Map"

[static.dm_map]
# DM actuator grid map
source = "TODO"
dataset = "WFS/DM_Map"

[static.m2c]
# modes to commands matrix, (n_act, n_modes) either way round
source = "TODO"
dataset = "Calibration/M2C"

[static.z2c]
# Zernike to DM commands matrix, (n_act, n_zernike) either way round
source = "TODO"
dataset = "Calibration/Z2C"

[static.loop_gain]
source = "TODO"
attr = "WFS@Loop_Gain"

[static.loop_leak]
source = "TODO"
attr = "WFS@Loop_Leak"

[static.camera_fps]
# science camera frame rate [Hz]
source = "TODO"
attr = "Science/camera/Science_PSFs@FPS"

[static.camera_dit]
# science camera exposure time [s]
source = "TODO"
attr = "Science/camera/Science_PSFs@Exposure_Time"

[static.camera_gain]
# science camera gain
source = "TODO"
attr = "Science/camera/Science_PSFs@Gain"

